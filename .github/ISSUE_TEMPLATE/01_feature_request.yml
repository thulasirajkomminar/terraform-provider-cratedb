name: "Request a Feature"
description: "Suggest a new resource, data source, or other enhancement."
title: "[Feature]: "
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Hi there,
        Thank you for opening an issue! Please note that we try to keep this issue tracker reserved for
        bug reports and feature requests related to the CrateDB provider.

  - type: textarea
    id: use_cases
    attributes:
      label: Use Cases
      description: |
        In order to properly evaluate a feature request, it is necessary to understand the use-cases for it.
        Please describe the _end goal_ you are trying to achieve that has led you to request this feature.
        Please keep this section focused on the problem and not on the suggested solution.
    validations:
      required: true

  - type: textarea
    id: attempted_solutions
    attributes:
      label: Attempted Solutions
      description: |
        If you've already tried to solve the problem with existing features and found a limitation that prevented you from succeeding, please describe it below in as much detail as possible.
        Ideally, this would include real configuration snippets that you tried, real Terraform command lines you ran, and what results you got in each case.
        Please remove any sensitive information such as passwords before sharing configuration snippets and command lines.
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        If you have an idea for a way to address the problem via a change to this provider, please describe it below.
        It's helpful to include specific examples of how what you are suggesting might look in configuration files, since that allows us to understand the full picture of what you are proposing.
        If you don't know what you'd propose or are unsure of some details, don't worry! When we evaluate the feature request we'll be happy to help.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Where possible, please supply links to the [CrateDB Cloud API documentation](https://console.cratedb.cloud/api/docs), vendor documentation, other GitHub issues (open or closed) or pull requests that give additional context.
    validations:
      required: false
